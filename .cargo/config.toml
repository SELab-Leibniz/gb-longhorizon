# Build settings shared by every crate in the workspace.
#
# The agent sandbox runs with NO network. Before the run, the harness
# vendors the dependency set with `harness/scripts/vendor.sh`, which
# uncomments the [source] block below. Apart from the optional demo window
# (not part of the sandbox), no crate has dependencies (GEP 1 R-BASE-1).

[build]
rustflags = ["-D", "warnings"]

# [source.crates-io]
# replace-with = "vendored-sources"
#
# [source.vendored-sources]
# directory = "vendor"

[net]
offline = false   # vendor.sh flips this to true for the sandbox image
