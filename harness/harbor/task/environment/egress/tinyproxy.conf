LogFile "/var/log/tinyproxy/tinyproxy.log"
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Info
MaxClients 64

# Only clients on private (docker) networks may use the proxy, plus
# localhost for the container's own health check.
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Only HTTPS tunnels (CONNECT :443). Plain-HTTP proxying is refused by the
# filter below for anything not on the list, and the LLM APIs are HTTPS.
ConnectPort 443

# Host allowlist. Everything not matching is rejected with 403.
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes

# Don't leak the sandbox's identity.
DisableViaHeader Yes
