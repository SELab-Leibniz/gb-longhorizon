# harbor run -c harness/harbor/jobs/jiuwenswarm.yaml
job_name: gb-jiuwenswarm
jobs_dir: jobs
n_attempts: 1      # 1 trial per agent for this campaign; BENCHMARK.md recommends 3 for statistical claims
orchestrator:
  type: local
  n_concurrent_trials: 1
environment:
  type: docker
  force_build: false
  delete: false      # keep the containers + repo volume for inspection
agents:
  - import_path: gb_agents:JiuwenSwarmAgent
    model_name: deepseek/deepseek-flash
    env:
      API_KEY: ${DEEPSEEK_API_KEY}
    kwargs:
      run_seconds: 172500
      chaos_after_sec: 0     # no forced interruption: agents are black boxes (BENCHMARK.md)
    override_setup_timeout_sec: 600
tasks:
  - path: harness/harbor/task
