# 6-hour difficulty pilot: one iCode trial under the benchmark protocol, with
# repository snapshots every hour (GB_SNAPSHOT_HOURS=1) to measure the
# progress curve. If the reward is already high after a few hours, the task
# is too easy for a 48-hour benchmark.
#   GB_SNAPSHOT_HOURS=1 harbor run -c harness/harbor/jobs/pilot-6h.yaml -y
job_name: gb-pilot-6h
jobs_dir: jobs
n_attempts: 1
orchestrator:
  type: local
  n_concurrent_trials: 1
environment:
  type: docker
  force_build: false
  delete: false      # keep the containers + repo volume for inspection
agents:
  - import_path: gb_agents:ICodeAgent
    model_name: deepseek/deepseek-flash
    env:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    kwargs:
      run_seconds: 21600       # 6 hours
      chaos_after_sec: 0       # no forced interruption (benchmark setting)
    override_timeout_sec: 22800
    override_setup_timeout_sec: 600
tasks:
  - path: harness/harbor/task
